        /* Poppins visual via system stack - no external fetch for offline validation */
        * { margin:0; padding:0; box-sizing:border-box; }
        .brew-root {
          font-family: 'Poppins', system-ui, -apple-system, sans-serif;
          background: #FFFBF5;
          color: #2B1E16;
          line-height: 1.6;
          -webkit-font-smoothing: antialiased;
          overflow-x: hidden;
        }
        .brew-serif {
          font-family: 'Fraunces', serif;
          font-weight: 600;
          letter-spacing: -0.02em;
        }

        /* Layout */
        .brew-shell {
          max-width: 1160px;
          margin: 0 auto;
          padding: 0 28px;
        }
        @media(max-width: 600px){
          .brew-shell { padding: 0 20px; }
        }

        /* Nav */
        .brew-nav {
          position: sticky;
          top: 0;
          z-index: 30;
          backdrop-filter: blur(14px);
          background: rgba(255,251,245,0.82);
          border-bottom: 1px solid rgba(43,30,22,0.07);
        }
        .brew-nav-inner {
          height: 72px;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .brew-logo {
          display:flex; align-items:center; gap:10px;
          text-decoration:none;
        }
        .brew-logo-mark {
          width:36px; height:36px;
          border-radius: 12px;
          background:#2B1E16;
          color:#FFFBF5;
          display:grid; place-items:center;
          font-weight:700; font-size:14px; letter-spacing:0.06em;
        }
        .brew-logo-text {
          font-weight:700; font-size:15px; letter-spacing:0.12em; color:#2B1E16;
        }
        .brew-nav-links {
          display:flex; gap:32px; align-items:center;
        }
        .brew-nav-links a {
          text-decoration:none; font-size:13.5px; font-weight:500;
          color: rgba(43,30,22,0.7); letter-spacing:0.02em;
          transition: color .2s;
        }
        .brew-nav-links a:hover { color:#2B1E16; }
        .brew-nav-cta {
          padding: 10px 18px;
          border-radius: 999px;
          background:#2B1E16;
          color:#FFFBF5;
          font-size:13px; font-weight:600; letter-spacing:0.02em;
          text-decoration:none;
          transition: transform .2s, background .2s;
        }
        .brew-nav-cta:hover { transform: translateY(-1px); background:#1e1510; }
        @media(max-width: 800px){
          .brew-nav-links { display:none; }
        }

        /* Hero */
        .brew-hero {
          padding: 54px 0 36px;
          display:grid;
          grid-template-columns: 1.05fr 0.95fr;
          gap: 48px;
          align-items:center;
        }
        @media(max-width: 900px){
          .brew-hero { grid-template-columns: 1fr; gap:28px; padding-top:32px; }
        }
        .brew-pill {
          display:inline-flex; align-items:center; gap:8px;
          padding: 7px 14px;
          border-radius:999px;
          background:#fff;
          border:1px solid rgba(43,30,22,0.08);
          box-shadow: 0 2px 12px rgba(43,30,22,0.04);
          font-size:11.5px; font-weight:600; letter-spacing:0.08em;
          text-transform:uppercase; color: rgba(43,30,22,0.6);
        }
        .brew-pill-dot {
          width:6px; height:6px; border-radius:50%; background:#C07A4A;
          box-shadow: 0 0 0 4px rgba(192,122,74,0.18);
        }
        .brew-hero h1 {
          margin-top:22px;
          font-size: clamp(38px, 5.6vw, 72px);
          line-height: 0.92;
          font-weight: 600;
          letter-spacing: -0.04em;
        }
        .brew-hero h1 em {
          font-family:'Fraunces', serif;
          font-style:italic;
          font-weight:400;
          color:#9C6B4A;
        }
        .brew-hero-desc {
          margin-top:18px;
          max-width: 460px;
          font-size: 16px;
          color: rgba(43,30,22,0.62);
          line-height: 1.7;
        }
        .brew-hero-actions {
          margin-top:28px;
          display:flex; gap:12px; flex-wrap:wrap; align-items:center;
        }
        .btn-primary {
          display:inline-flex; align-items:center; gap:10px;
          padding: 14px 26px;
          border-radius:999px;
          background:#2B1E16;
          color:#FFFBF5;
          text-decoration:none;
          font-size:14px; font-weight:600;
          transition: all .22s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow:0 10px 24px rgba(43,30,22,0.18); }
        .btn-ghost {
          display:inline-flex; align-items:center; gap:8px;
          padding: 14px 22px;
          border-radius:999px;
          background:#fff;
          border:1px solid rgba(43,30,22,0.1);
          color:#2B1E16;
          text-decoration:none;
          font-size:14px; font-weight:500;
        }
        .brew-hero-meta {
          margin-top:34px;
          display:flex; gap:28px;
          border-top:1px dashed rgba(43,30,22,0.12);
          padding-top:22px;
          max-width:420px;
        }
        .brew-meta-item b { display:block; font-size:22px; line-height:1; font-weight:600; }
        .brew-meta-item span { font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color: rgba(43,30,22,0.5); font-weight:600; margin-top:6px; display:block; }

        /* Hero Visual */
        .brew-visual {
          position:relative;
          aspect-ratio: 0.95;
          border-radius: 36px;
          background: linear-gradient(180deg, #F7E9D6 0%, #EADFCB 100%);
          padding: 18px;
          overflow:hidden;
          box-shadow: 0 20px 60px rgba(43,30,22,0.08);
        }
        @media(max-width:900px){ .brew-visual { aspect-ratio: 1.1; } }
        .brew-visual-inner {
          width:100%; height:100%;
          border-radius: 26px;
          background: #FFFBF5;
          position:relative;
          overflow:hidden;
          display:flex;
          flex-direction:column;
        }
        .brew-visual-top {
          height: 58%;
          background: radial-gradient(120% 120% at 30% 20%, #FFF6E8 0%, #E9DCC3 55%, #D9C3A3 100%);
          position:relative;
        }
        .brew-cup {
          position:absolute;
          left:50%; top:55%;
          transform: translate(-50%, -50%);
          width: 56%;
          aspect-ratio: 1;
        }
        .brew-cup-shadow {
          position:absolute;
          bottom:8%; left:50%; transform:translateX(-50%);
          width:62%; height:18%;

        .brew-badge {

          background:#2B1E16;
          color:#fff;
          display:grid; place-items:center;
          font-size:18px;
        }

        /* Sections */
        .brew-section {
          padding: 86px 0;
        }
        .brew-section-head {
          display:flex; justify-content:space-between; align-items:end;
          gap:20px; margin-bottom:36px; flex-wrap:wrap;
        }
        .brew-kicker {
          font-size:11.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;
          color:#C07A4A;
        }
        .brew-h2 {
          font-size: clamp(28px, 3.4vw, 44px);
          line-height:0.95; letter-spacing:-0.03em; margin-top:10px;
        }
        .brew-h2 em { font-family:'Fraunces', serif; font-style:italic; font-weight:400; color:#9C6B4A; }
        .brew-head-desc { max-width: 360px; font-size:14.5px; color: rgba(43,30,22,0.58); line-height:1.6; }

        /* Menu */
        .brew-menu-grid {
          display:grid;
          grid-template-columns: repeat(3, 1fr);
          gap:18px;
        }

        @media(max-width: 580px){ .brew-menu-grid { grid-template-columns: 1fr;} }
        .brew-card {
          background:#fff;
          border-radius: 24px;
          padding:18px;
          border:1px solid rgba(43,30,22,0.06);
          transition: transform .25s, box-shadow .25s;
          position:relative;
          overflow:hidden;
        }
        .brew-card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(43,30,22,0.08); }
        .brew-card-top {
          height:168px;
          border-radius:16px;
          background: linear-gradient(180deg, var(--c1), var(--c2));
          position:relative;
          display:grid; place-items:center;
          overflow:hidden;
        }
        .brew-card-top span {
          font-size:54px;
          filter: drop-shadow(0 8px 18px rgba(0,0,0,0.12));
        }
        .brew-card-price {
          position:absolute;
          top:12px; right:12px;
          background:#2B1E16;
          color:#FFFBF5;
          font-size:12.5px; font-weight:700;
          padding:6px 11px;
          border-radius:999px;
          letter-spacing:0.02em;
        }
        .brew-card h3 { margin-top:14px; font-size:16px; font-weight:600; letter-spacing:-0.01em; }
        .brew-card p { margin-top:6px; font-size:13px; color: rgba(43,30,22,0.58); line-height:1.5; min-height:38px; }
        .brew-card-foot {
          margin-top:14px;
          display:flex; align-items:center; justify-content:space-between;
          font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
          color: rgba(43,30,22,0.45);

        @media(max-width:900px){ .brew-about { grid-template-columns:1fr; } }
        .brew-about-visual {
